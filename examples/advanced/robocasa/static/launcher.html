<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Retriever RoboCasa Scenes</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: #172033;
        background: #f4f6f8;
        letter-spacing: 0;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100vh; }
      button, input, select, textarea { font: inherit; letter-spacing: 0; }
      button { cursor: pointer; }
      button:disabled { cursor: default; opacity: 0.45; }
      .shell {
        height: 100vh; height: 100dvh; overflow: hidden; display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
      }
      .rail {
        min-height: 0; overflow-y: auto; background: #fff;
        border-right: 1px solid #dce1e7; padding: 26px 22px;
      }
      .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
      .brand-mark { width: 12px; height: 12px; background: #d5a61f; border-radius: 2px; }
      .brand strong { font-size: 18px; }
      .eyebrow { margin: 0 0 8px; color: #687386; font-size: 12px; font-weight: 700; text-transform: uppercase; }
      h1 { margin: 0 0 22px; font-size: 28px; line-height: 1.15; }
      .scene-list { display: grid; gap: 8px; }
      .scene-row {
        width: 100%; padding: 14px; border: 1px solid #d9dfe7; border-radius: 6px;
        background: #fff; color: inherit; text-align: left;
      }
      .scene-row:hover { border-color: #8c9bb0; }
      .scene-row:disabled { opacity: 1; cursor: not-allowed; background: #f7f8fa; color: #657083; }
      .scene-row:disabled:hover { border-color: #d9dfe7; }
      .scene-row[aria-pressed="true"] { border-color: #2574c8; box-shadow: inset 3px 0 #2574c8; background: #f5f9fe; }
      .scene-row strong { display: block; margin-bottom: 7px; font-size: 15px; }
      .meta { display: flex; gap: 8px; align-items: center; color: #687386; font-size: 12px; }
      .kind { padding: 2px 6px; border-radius: 3px; background: #e9eef4; color: #3e4b5e; font-weight: 700; }
      .availability { margin-left: auto; font-weight: 700; }
      .availability.ready { color: #27854a; }
      .availability.missing { color: #a04b42; }
      .reason { display: block; margin-top: 8px; color: #8a4f48; font-size: 12px; line-height: 1.35; }
      .main {
        min-width: 0; min-height: 0; overflow-y: auto; display: grid;
        grid-template-rows: minmax(280px, 52vh) auto; align-content: start;
        background: #f4f6f8;
      }
      .preview {
        position: relative; min-height: 0; overflow: hidden; margin: 24px 28px 0;
        border: 1px solid #d6dde5; border-radius: 6px; background: #e6eaee;
        box-shadow: 0 1px 2px rgba(20, 28, 40, 0.06);
      }
      .preview img { width: 100%; height: 100%; object-fit: contain; display: block; }
      .preview-empty {
        position: absolute; inset: 0; display: grid; place-items: center;
        padding: 24px; color: #687386; text-align: center;
      }
      .status {
        position: absolute; top: 18px; right: 18px; display: flex; align-items: center;
        gap: 8px; padding: 9px 11px; border-radius: 5px; background: rgba(20, 28, 40, 0.88);
        max-width: min(32rem, calc(100% - 36px)); color: #fff; font-size: 13px;
        overflow-wrap: anywhere; backdrop-filter: blur(8px);
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #9da7b4; }
      .status[data-state="ready"] .dot { background: #45b96b; }
      .status[data-state="starting"] .dot { background: #e0aa32; }
      .status[data-state="stopping"] .dot { background: #e0aa32; }
      .status[data-state="failed"] .dot { background: #df5b5b; }
      .controls {
        margin: 18px 28px 28px; padding: 20px 22px 22px; background: #fff;
        border: 1px solid #dce1e7; border-radius: 6px;
      }
      .control-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
      h2 { margin: 0; font-size: 23px; }
      .control-grid {
        display: grid;
        grid-template-columns:
          minmax(90px, 0.65fr) minmax(120px, 0.9fr) minmax(160px, 1.2fr)
          minmax(150px, 1.1fr) minmax(200px, 1.8fr);
        gap: 12px; align-items: end;
      }
      .command-actions {
        grid-column: 1 / -1; display: flex; justify-content: flex-end;
        flex-wrap: wrap; gap: 10px;
      }
      label { display: grid; gap: 6px; color: #687386; font-size: 12px; font-weight: 700; }
      input, select, textarea { width: 100%; border: 1px solid #cfd6df; border-radius: 5px; padding: 0 11px; color: #172033; background: #fff; }
      input, select { height: 42px; }
      textarea { min-height: 42px; height: 42px; padding-top: 10px; resize: vertical; }
      .button { height: 42px; border: 1px solid transparent; border-radius: 5px; padding: 0 18px; font-weight: 700; white-space: nowrap; }
      .control-grid .button { padding-inline: 12px; }
      .primary { background: #2574c8; color: #fff; }
      .primary:hover { background: #1e63ad; }
      .secondary { background: #fff; color: #26364c; border-color: #cfd6df; }
      .secondary:hover { background: #f2f5f8; }
      .empty { padding: 16px; border: 1px dashed #c9d1db; color: #687386; border-radius: 6px; }
      @media (max-width: 1120px) {
        .control-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .control-grid label:last-of-type { grid-column: 1 / -1; }
      }
      @media (max-width: 820px) {
        .shell { height: auto; min-height: 100vh; overflow: visible; grid-template-columns: 1fr; }
        .rail {
          min-height: auto; overflow: visible; border-right: 0;
          border-bottom: 1px solid #dce1e7; padding: 20px;
        }
        .brand { margin-bottom: 18px; }
        h1 { font-size: 24px; margin-bottom: 16px; }
        .scene-list { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
        .main {
          min-height: 620px; height: auto; overflow: visible;
          grid-template-rows: minmax(320px, 52vh) auto;
        }
        .preview { margin: 18px 20px 0; }
        .controls { margin: 16px 20px 20px; }
        .control-grid { grid-template-columns: 1fr 1fr; }
      }
      @media (max-width: 520px) {
        .main { grid-template-rows: minmax(260px, 46vh) auto; }
        .preview { min-height: 260px; margin: 14px 14px 0; }
        .controls { margin: 12px 14px 14px; padding: 18px; }
        .control-head { align-items: start; flex-direction: column; }
        .control-grid { grid-template-columns: 1fr; }
        .control-grid label:last-of-type { grid-column: auto; }
        .command-actions { display: grid; grid-template-columns: 1fr; }
        .button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="rail">
        <div class="brand"><span class="brand-mark"></span><strong>GoldenRetriever</strong></div>
        <p class="eyebrow">RoboCasa</p>
        <h1>Task catalog</h1>
        <div class="scene-list" id="scene-list"><div class="empty">Loading scenes...</div></div>
      </aside>
      <main class="main">
        <section class="preview">
          <img id="preview" alt="" />
          <div class="preview-empty" id="preview-empty" hidden>Preview media is not included in this installation.</div>
          <div class="status" id="status" data-state="idle" role="status" aria-live="polite"><span class="dot"></span><span id="status-text">Idle</span></div>
        </section>
        <section class="controls">
          <div class="control-head">
            <div><p class="eyebrow" id="kind">Scene</p><h2 id="task">Select a scene</h2></div>
            <div class="meta" id="details"></div>
          </div>
          <div class="control-grid">
            <label>Episode <input id="episode" type="number" min="0" value="0" /></label>
            <label>Planner <select id="planner"><option value="offline">Offline</option><option value="gemini">Gemini</option></select></label>
            <label>Execution <select id="execution-mode"><option value="demonstration">Deterministic demonstration</option><option value="live_planning">Dynamic skill plan + action replay</option></select></label>
            <label>Interface <select id="interface"><option value="console">Retriever console</option><option value="viser">Viser native</option></select></label>
            <label>Goal <textarea id="goal" placeholder="Describe the task goal"></textarea></label>
            <div class="command-actions">
              <button class="button secondary" id="stop" disabled>Stop</button>
              <button class="button primary" id="launch" disabled>Launch task</button>
              <button class="button secondary" id="open" disabled>Open console</button>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script>
      const list = document.querySelector("#scene-list");
      const preview = document.querySelector("#preview");
      const previewEmpty = document.querySelector("#preview-empty");
      const task = document.querySelector("#task");
      const kind = document.querySelector("#kind");
      const details = document.querySelector("#details");
      const episode = document.querySelector("#episode");
      const goal = document.querySelector("#goal");
      const planner = document.querySelector("#planner");
      const executionMode = document.querySelector("#execution-mode");
      const interfaceMode = document.querySelector("#interface");
      const launch = document.querySelector("#launch");
      const stop = document.querySelector("#stop");
      const open = document.querySelector("#open");
      const status = document.querySelector("#status");
      const statusText = document.querySelector("#status-text");
      let scenes = [];
      let selected = null;
      let consoleUrl = "http://localhost:8086";
      let openUrl = consoleUrl;
      let currentStatus = { state: "idle", task: null, interface: "console" };
      let statusPollBusy = false;
      let actionBusy = false;
      let requestGeneration = 0;

      function selectScene(scene) {
        selected = scene;
        task.textContent = scene.task;
        kind.textContent = `${scene.kind} task`;
        const episodeLabel = scene.episodes > 0
          ? `${scene.episodes} episodes`
          : "Episode count unavailable";
        details.textContent = `${episodeLabel} · horizon ${scene.horizon}`;
        const hasPreview = Boolean(scene.preview);
        preview.hidden = !hasPreview;
        previewEmpty.hidden = hasPreview;
        preview.src = scene.preview || "";
        preview.alt = hasPreview ? `${scene.task} RoboCasa preview` : "";
        const maxEpisode = Math.max(0, scene.episodes - 1);
        if (scene.episodes > 0) episode.max = String(maxEpisode);
        else episode.removeAttribute("max");
        episode.value = String(Math.min(Math.max(0, Number(episode.value) || 0), maxEpisode));
        goal.value = scene.task;
        document.querySelectorAll(".scene-row").forEach((row) => {
          row.setAttribute("aria-pressed", String(row.dataset.task === scene.task));
        });
        applyStatus(currentStatus);
      }

      function renderScenes() {
        if (!scenes.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "No runnable RoboCasa tasks were found.";
          list.replaceChildren(empty);
          return;
        }
        list.replaceChildren(...scenes.map((scene) => {
          const row = document.createElement("button");
          row.className = "scene-row";
          row.dataset.task = scene.task;
          row.setAttribute("aria-pressed", "false");
          row.disabled = !scene.available;

          const title = document.createElement("strong");
          title.textContent = scene.task;
          const meta = document.createElement("span");
          meta.className = "meta";
          const kindLabel = document.createElement("span");
          kindLabel.className = "kind";
          kindLabel.textContent = scene.kind;
          const split = document.createElement("span");
          split.textContent = scene.split;
          const availability = document.createElement("span");
          availability.className = `availability ${scene.available ? "ready" : "missing"}`;
          availability.textContent = scene.available ? "Ready" : "Dataset needed";
          meta.append(kindLabel, split, availability);
          row.append(title, meta);
          if (!scene.available && scene.unavailable_reason) {
            const reason = document.createElement("span");
            reason.className = "reason";
            reason.textContent = scene.unavailable_reason;
            row.append(reason);
          }
          row.addEventListener("click", () => selectScene(scene));
          return row;
        }));
        const initial = scenes.find((scene) => scene.task === "PrepareCoffee" && scene.available)
          || scenes.find((scene) => scene.available);
        if (initial) selectScene(initial);
      }

      function applyStatus(next) {
        currentStatus = { ...currentStatus, ...next };
        if (next.state && next.state !== "failed" && !("error" in next)) {
          currentStatus.error = null;
        }
        consoleUrl = currentStatus.console_url || currentStatus.viewer_url || consoleUrl;
        openUrl = currentStatus.open_url || consoleUrl;
        open.textContent = currentStatus.interface === "viser"
          ? "Open Viser dashboard"
          : "Open console";
        status.dataset.state = currentStatus.state;
        const label = currentStatus.error || (
          currentStatus.task
            ? `${currentStatus.state} · ${currentStatus.task}`
            : currentStatus.state
        );
        statusText.textContent = label;
        open.disabled = actionBusy || currentStatus.state !== "ready";
        stop.disabled = actionBusy || !["starting", "ready"].includes(currentStatus.state);
        launch.disabled = actionBusy
          || currentStatus.state === "starting"
          || !selected
          || !selected.available;
      }

      async function responsePayload(response) {
        try {
          return await response.json();
        } catch (_error) {
          return {};
        }
      }

      function renderSceneError(message) {
        const empty = document.createElement("div");
        empty.className = "empty";
        const text = document.createElement("p");
        text.textContent = message;
        const retry = document.createElement("button");
        retry.type = "button";
        retry.className = "secondary";
        retry.textContent = "Retry";
        retry.addEventListener("click", loadScenes);
        empty.append(text, retry);
        list.replaceChildren(empty);
      }

      async function request(url, options = {}, timeoutMs = 5000) {
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), timeoutMs);
        try {
          return await fetch(url, { cache: "no-store", ...options, signal: controller.signal });
        } finally {
          window.clearTimeout(timeout);
        }
      }

      async function updateStatus(expectedGeneration = requestGeneration) {
        if (statusPollBusy) return;
        statusPollBusy = true;
        try {
          const response = await request("/api/status");
          if (!response.ok) return;
          const current = await response.json();
          if (expectedGeneration === requestGeneration) applyStatus(current);
        } catch (_error) {
          if (expectedGeneration === requestGeneration) {
            applyStatus({ state: "failed", error: "Launcher connection lost" });
          }
        } finally {
          statusPollBusy = false;
        }
      }

      launch.addEventListener("click", async () => {
        const generation = ++requestGeneration;
        actionBusy = true;
        applyStatus({ state: "starting", task: selected.task, error: null });
        try {
          const response = await request("/api/launch", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              task: selected.task,
              episode: Number(episode.value),
              goal: goal.value,
              planner: planner.value,
              execution_mode: executionMode.value,
              interface: interfaceMode.value,
            }),
          }, 30000);
          const payload = await responsePayload(response);
          if (generation !== requestGeneration) return;
          applyStatus(response.ok ? payload : {
            state: "failed",
            task: selected.task,
            error: payload.detail || "Launch failed",
          });
        } catch (_error) {
          if (generation === requestGeneration) {
            applyStatus({
              state: "failed",
              task: selected.task,
              error: "Could not reach the launcher",
            });
          }
        } finally {
          if (generation === requestGeneration) {
            actionBusy = false;
            applyStatus(currentStatus);
            await updateStatus(generation);
          }
        }
      });

      stop.addEventListener("click", async () => {
        const generation = ++requestGeneration;
        actionBusy = true;
        applyStatus({ state: "stopping", error: null });
        try {
          const response = await request("/api/stop", { method: "POST" }, 30000);
          if (response.ok && generation === requestGeneration) {
            applyStatus(await responsePayload(response));
          } else if (generation === requestGeneration) {
            const payload = await responsePayload(response);
            applyStatus({
              state: "failed",
              error: payload.detail || "Stop failed",
            });
          }
        } catch (_error) {
          if (generation === requestGeneration) {
            applyStatus({ state: "failed", error: "Could not reach the launcher" });
          }
        } finally {
          if (generation === requestGeneration) {
            actionBusy = false;
            applyStatus(currentStatus);
            await updateStatus(generation);
          }
        }
      });
      open.addEventListener("click", () => window.open(openUrl, "retriever-robocasa-console"));

      async function loadScenes() {
        try {
          const response = await request("/api/scenes");
          const payload = await responsePayload(response);
          if (!response.ok || !Array.isArray(payload)) {
            throw new Error(payload.detail || "Task catalog is unavailable");
          }
          scenes = payload;
          renderScenes();
        } catch (error) {
          renderSceneError(error.name === "AbortError" ? "Task catalog timed out." : error.message);
        }
      }

      loadScenes();
      updateStatus();
      setInterval(updateStatus, 1000);
    </script>
  </body>
</html>
