name: RoboCasa smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/robocasa-smoke.yml"
      - "examples/advanced/robocasa/**"
      - "examples/advanced/robosuite_lift/**"
      - "pixi.toml"
      - "pixi.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked-environment:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.72.1
          cache: true
      - name: Import stack and step headless simulation
        run: pixi run --locked -e robocasa robocasa-smoke
