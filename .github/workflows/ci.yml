name: CI

on:
  push:
    branches:
      - main
      - chore/cleanup
      - release/public-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.70.1
          cache: true
      - name: Tests
        run: pixi run test
      - name: Docs build
        run: pixi run -e docs docs-build
      - name: Golden smoke demo
        run: pixi run -e golden demo-perception-detection-flow
      - name: Public surface guardrail
        run: pixi run public-surface-check
      - name: Package build
        run: pixi run build
