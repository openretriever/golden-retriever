name: CI

on:
  push:
    branches:
      - main
      - chore/cleanup
      - release/public-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.70.1
          cache: true
      - name: Public history guardrail
        if: github.event_name == 'pull_request'
        env:
          PUBLIC_PR_TITLE: ${{ github.event.pull_request.title }}
          PUBLIC_PR_BODY: ${{ github.event.pull_request.body }}
        run: >-
          pixi run python scripts/release/check_public_history.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
      - name: Tests
        run: pixi run test
      - name: Simulation tests (MuJoCo)
        run: pixi run -e simulation-test test-simulation
      - name: Docs build
        run: pixi run -e docs docs-build
      - name: Golden smoke demo
        run: pixi run -e golden-retriever demo-perception-detection-flow
      - name: Public surface guardrail
        run: pixi run public-surface-check
      - name: Package build
        run: pixi run build
