name: Docs

on:
  push:
    branches:
      - main
      - chore/cleanup
      - release/public-v1
    paths:
      - docs-site/**
      - pixi.toml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.70.1
          cache: true
      - name: Build docs
        run: pixi run -e docs docs-build
      - uses: actions/upload-artifact@v4
        with:
          name: golden-retriever-docs
          path: docs-site/dist

  deploy-cloudflare-pages:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: golden-retriever-docs
          path: docs-site/dist
      # main -> production; chore/cleanup -> dev-docs preview alias. release/public-v1 builds only.
      - name: Deploy to Cloudflare Pages
        if: ${{ github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/chore/cleanup') }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs-site/dist --project-name=retriever-space --branch=${{ github.ref == 'refs/heads/main' && 'main' || 'dev-docs' }}
