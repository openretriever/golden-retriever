site_name: Golden Reference Examples
site_description: "Golden reference examples for Retriever: maintained robot-facing examples, reusable type packs, visualization lanes, and Hub-pack candidates."
site_url: https://retriever-space.pages.dev/
repo_url: https://github.com/openretriever/golden-retriever
repo_name: openretriever/golden-retriever
edit_uri: edit/main/docs/
theme:
  name: material
  logo: assets/retriever-illustrative.jpeg
  favicon: assets/logo.svg
  palette:
    - scheme: default
      primary: amber
      accent: teal
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

validation:
  omitted_files: ignore

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

nav:
  - Overview: README.md
  - Retriever Core:
      - Retriever Home: https://openretriever.org/
      - Core Runtime Docs: https://openretriever-docs.pages.dev/
      - Core Visual Quickstart: https://openretriever-docs.pages.dev/getting-started/visual-quickstart/
      - Core Debugging Guide: https://openretriever-docs.pages.dev/tutorials/debug-and-visualize/
      - Retriever Hub Concepts: https://openretriever-docs.pages.dev/ecosystem/
      - Core Source: https://github.com/openretriever/retriever
  - Golden Examples:
      - Hub Proof: examples/golden_hub_packs_v1.md
      - Example Catalog: examples/README.md
      - Perception and Memory: examples/perception_and_memory_v1.md
      - Language and Grounding: examples/language_and_grounding_v1.md
      - Pipeline Composition: examples/pipeline_composition_v1.md
      - Simulation and Visualization: examples/simulation_and_visualization_v1.md
  - Retriever Hub Packs:
      - Pack Boundary: hub/README.md
      - Current Export Catalog: hub/export_catalog_v1.md
      - Pack Promotion Roadmap: hub/pack_roadmap_v1.md
  - Robot Type Packs:
      - Overview: robotics_typing_standard/README.md
      - Integrated Standard: robotics_typing_standard/00_integrated_robotics_typing_standard_v1.md
      - Type Catalog: robotics_typing_standard/01_type_catalog_and_semantics.md
      - Flow Composition Contract: robotics_typing_standard/02_flow_composition_contract.md
      - Hub Sharing Profile: robotics_typing_standard/03_hub_sharing_profile.md
      - Data and Event Streams: robotics_typing_standard/07_data_spec_eventstream_v1.md
      - LeRobot Interop: robotics_typing_standard/08_lerobot_interop_and_dataset_profile.md
  - Agent Map: llms.txt
