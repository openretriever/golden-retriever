# =============================================================================
# Pixi Configuration (Golden / System Stack) — TEMPLATE
# =============================================================================
#
# This manifest is a companion to `pyproject-golden.toml`.
#
# Purpose
# - The repo root `pixi.toml` is intentionally **runtime-only** (fast, minimal).
# - This `pixi-golden.toml` captures the **full system** environment (models/robots/etc.)
#   that will move to a separate golden repo.
#
# Important
# - Pixi writes a `pixi.lock` next to the manifest. If you run Pixi with
#   `--manifest-path pixi-golden.toml` in this repo, it will update `pixi.lock`.
# - Recommended workflow today: copy this file into the future golden repo (or a
#   separate working directory) before running `pixi install`.
#
# =============================================================================

[workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[pypi-dependencies]
# Temporary: install this monorepo editable, but keep core extras only.
# In the split, this becomes the `retriever-golden` package in the golden repo.
retriever = { path = "dist/retriever_dist/install/retriever-0.0.0-py3-none-any.whl", editable = false, extras = [
    "dora",
    "demo",
] }

# Keep test tooling lightweight.
pygments = "*"
typing-extensions = "*"

# -----------------------------------------------------------------------------
# Base system feature (the "golden" stack)
# -----------------------------------------------------------------------------
[dependencies]

[feature.py311.dependencies]
python = "3.11.*"

[feature.golden.dependencies]
# Required for HEIF bindings (pyheif / pillow-heif) when using the legacy stack.
libheif = "*"

[feature.golden.pypi-dependencies]
transformers = "*"
openai = "*"
accelerate = "*"
google-genai = "*"
pillow-heif = "*"
pyheif = "*"
ray = { version = "*", extras = ["all"] }
langchain = "*"
langchain_openai = "*"
supervision = "*"
ultralytics = "==8.3.40"
ultralytics-thop = "==2.0.12"
einops = "*"
pycocotools = "*"
sam2 = "*"
hydra-core = "*"
omegaconf = "*"
click = "*"
rich = "*"
ftfy = "*"
regex = "*"
tqdm = "*"
spatialmath-python = "*"
pydantic = ">=2.0.0"
fastapi = ">=0.100.0"
uvicorn = { version = "*", extras = ["standard"] }
httpx = "*"
pymongo = "*"
pytorch_lightning = "*"
pddlgym = { git = "https://github.com/linfeng-z/pddlgym.git" }
protobuf = "==3.20.*"
packaging = "*"
Pillow = "*"
scipy = "*"
pandas = "*"
seaborn = ">=0.13.2"
py-cpuinfo = ">=9.0.0"
rerun-sdk = "*"
wandb = "*"
bitsandbytes = "*"
gym = "*"
dspy-ai = ">=2.4.0"
python-dotenv = "*"

# -----------------------------------------------------------------------------
# Optional: Training stack
# -----------------------------------------------------------------------------
[feature.training.pypi-dependencies]
absl-py = "*"
aiohttp = "*"
aiosignal = "*"
async-timeout = "*"
attrs = "*"
charset-normalizer = "*"
cmake = "*"
datasets = "*"
deepspeed = "*"
evaluate = "*"
frozenlist = "*"
fsspec = "*"
huggingface-hub = "*"
idna = "*"
multidict = "*"
ninja = "*"
psutil = "*"
responses = "*"
safetensors = "*"
sentencepiece = "*"
tokenizers = "*"
torch = "*"
# triton = "*"
xxhash = "*"
yarl = "*"

# -----------------------------------------------------------------------------
# Optional: Mapper stack
# -----------------------------------------------------------------------------
[feature.mapper.pypi-dependencies]
dgl = "*"
open3d = "*"
lxml = "*"
PyMCubes = "*"
trimesh = "*"
pyglet = "==1.5.27"

# -----------------------------------------------------------------------------
# Optional: Spot SDK stack
# -----------------------------------------------------------------------------
[feature.spot.pypi-dependencies]
bosdyn-client = "*"
bosdyn-core = "*"
bosdyn-api = "*"
bosdyn-mission = "*"
bosdyn-choreography-client = "*"

# -----------------------------------------------------------------------------
# Optional: Twist2 stack
# -----------------------------------------------------------------------------
[feature.twist2.pypi-dependencies]
dora-rs = "==0.3.13"
dora-rs-cli = "==0.3.13"
# dora-rs = "<0.4.0"
# dora-rs-cli = "<0.4.0"
onnxruntime = "*"
mujoco = "*"
rerun-sdk = "*"

[feature.twist2.tasks]
demo-twist2 = { cmd = "mjpython examples/advanced/twist2_simulation/app.py", env = { PYTHONPATH = "." } }
demo-twist2-rerun = { cmd = "python examples/advanced/twist2_simulation/app.py --no-viewer", env = { PYTHONPATH = "." } }

# -----------------------------------------------------------------------------
# Optional: VLM planning stack
# -----------------------------------------------------------------------------
[feature.vlm_planning]
system-requirements = { libc = "2.31" }

[feature.vlm_planning.pypi-dependencies]
alfworld = { git = "https://github.com/XiaofengLin7/alfworld_vlm.git" }
litellm = "*"
gymnasium = "*"
typing = "*"

# -----------------------------------------------------------------------------
# Optional: PyTorch environments (CPU/GPU)
# -----------------------------------------------------------------------------
[feature.gpu]
platforms = ["linux-64"]
system-requirements = { cuda = "12.0" }

[feature.gpu.pypi-dependencies]
torch = { version = ">=2.5.1", index = "https://download.pytorch.org/whl/cu124" }
torchvision = { version = ">=0.20.1", index = "https://download.pytorch.org/whl/cu124" }

[feature.cpu.pypi-dependencies]
torch = { version = ">=2.5.1", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = ">=0.20.1", index = "https://download.pytorch.org/whl/cpu" }

# -----------------------------------------------------------------------------
# Optional: ROS 2 benchmarks
# -----------------------------------------------------------------------------
[feature.ros]
platforms = ["linux-64"]
channels = ["robostack-kilted", "https://prefix.dev/conda-forge"]

[feature.ros.dependencies]
ros-kilted-ros-core = ">=0.12.0,<0.13"
ros-kilted-rmw-cyclonedds-cpp = ">=4.0.2,<5"
colcon-common-extensions = "*"

[feature.ros.activation]
scripts = ["experiments/benchmarks/ros/install/setup.bash"]

[feature.ros.activation.env]
RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"

[feature.ros.tasks]
build = { cmd = "colcon build", cwd = "./experiments/benchmarks/ros" }
benchmark_python = "ros2 run benchmark_python publisher & ros2 run benchmark_python subscriber"

# -----------------------------------------------------------------------------
# Optional: RoboPlan motion planning environments
# -----------------------------------------------------------------------------
[feature.roboplan]
platforms = ["linux-64"]

[feature.roboplan.dependencies]
roboplan-python = "*"
pinocchio = ">=3.9.0"

[feature.roboplan.pypi-dependencies]
xacro = "*"
tyro = "*"
viser = "*"
matplotlib = "*"

# -----------------------------------------------------------------------------
# Environments
# -----------------------------------------------------------------------------
[environments]
default = { features = ["py311"] }
training = { features = ["py311", "training"] }
mapper = { features = ["py311", "mapper"] }
spot = { features = ["py311", "spot"] }
vlm = { features = ["py311", "vlm_planning"] }
llm = { features = ["py311", "vlm_planning"] }
twist2 = { features = ["py311", "twist2"] }
cpu = { features = ["py311", "cpu"] }
gpu = { features = ["py311", "gpu"] }
ros = { features = ["ros"] }
roboplan = { features = ["py311", "roboplan"] }
golden = { features = ["py311", "golden"] }

[feature.vlm_planning.tasks]
# demo-highlevel-planning = { cmd = "python examples/experimental/closed_loop_planning/pipelines/demo_highlevel_planning.py" }
demo-highlevel-planning = { cmd = "python examples/experimental/closed_loop_planning/pipelines/demo_highlevel_planning.py", env = { RUST_LOG = "error" } }

# -----------------------------------------------------------------------------
# Tasks
# -----------------------------------------------------------------------------
[tasks]
demo-dora = "python -m examples.tutorial.009_dora_perception --backend dora"
demo-request-dora = "python -m examples.tutorial.010_request_response"
benchmark-dora-suite = { cmd = "dora up && dora start dataflow_node.yml --attach", cwd = "experiments/benchmarks/dora_benchmark/dora-rs/py-latency" }
benchmark-ros-suite-build = { cmd = "colcon build", cwd = "./experiments/benchmarks/dora_benchmark/ros2/py_pubsub" }
