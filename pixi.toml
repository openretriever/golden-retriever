# =============================================================================
# Pixi Configuration (Golden / System Stack)
# =============================================================================
#
# This manifest captures the heavier Golden example/demo environment.
# It installs the core Retriever runtime from the temporary public
# `retriever-core` package plus the extra libraries needed by the advanced
# system demos in this repo.
#
# =============================================================================

[workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[pypi-dependencies]
# Keep test tooling lightweight.
pytest = ">=8"
build = ">=1"
pygments = "*"
typing-extensions = "*"
mcap = "*"
jupytext = "*"


[feature.docs.dependencies]
nodejs = ">=22,<23"

[feature.docs.pypi-dependencies]

[feature.bundled_core.pypi-dependencies]
# Single source of the Retriever runtime dependency, shared by every environment.
# The canonical public runtime; >=0.0.2 has the timestamp-based sync sampling
# and the src-layout Hub loader that the manifest tests rely on.
retriever-core = { version = ">=0.0.2", extras = [
    "dora",
    "demo",
] }

# -----------------------------------------------------------------------------
# Base system feature (the GoldenRetriever example stack)
# -----------------------------------------------------------------------------
[dependencies]

[feature.py311.dependencies]
python = "3.11.*"

[feature.golden_retriever.dependencies]
# Required for HEIF bindings (pyheif / pillow-heif) when using the legacy stack.
libheif = "*"

[feature.golden_retriever.pypi-dependencies]
transformers = "*"
openai = "*"
accelerate = "*"
google-genai = "*"
pillow-heif = "*"
pyheif = "*"
ray = { version = "*", extras = ["all"] }
langchain = "*"
langchain_openai = "*"
supervision = "*"
ultralytics = "==8.3.40"
ultralytics-thop = "==2.0.12"
einops = "*"
pycocotools = "*"
sam2 = "*"
hydra-core = "*"
omegaconf = "*"
click = "*"
rich = "*"
ftfy = "*"
regex = "*"
tqdm = "*"
spatialmath-python = "*"
pydantic = ">=2.0.0"
fastapi = ">=0.100.0"
uvicorn = { version = "*", extras = ["standard"] }
httpx = "*"
pymongo = "*"
pytorch_lightning = "*"
protobuf = "==3.20.*"
packaging = "*"
Pillow = "*"
scipy = "*"
pandas = "*"
seaborn = ">=0.13.2"
py-cpuinfo = ">=9.0.0"
rerun-sdk = "*"
wandb = "*"
bitsandbytes = "*"
gym = "*"
dspy-ai = ">=2.4.0"
python-dotenv = "*"

# -----------------------------------------------------------------------------
# Optional: Training stack
# -----------------------------------------------------------------------------
[feature.training.pypi-dependencies]
absl-py = "*"
aiohttp = "*"
aiosignal = "*"
async-timeout = "*"
attrs = "*"
charset-normalizer = "*"
cmake = "*"
datasets = "*"
deepspeed = "*"
evaluate = "*"
frozenlist = "*"
fsspec = "*"
huggingface-hub = "*"
idna = "*"
multidict = "*"
ninja = "*"
psutil = "*"
responses = "*"
safetensors = "*"
sentencepiece = "*"
tokenizers = "*"
torch = "*"
# triton = "*"
xxhash = "*"
yarl = "*"

# -----------------------------------------------------------------------------
# Optional: Mapper stack
# -----------------------------------------------------------------------------
[feature.mapper.pypi-dependencies]
dgl = "*"
open3d = "*"
lxml = "*"
PyMCubes = "*"
trimesh = "*"
pyglet = "==1.5.27"

# -----------------------------------------------------------------------------
# Optional: Spot SDK stack
# -----------------------------------------------------------------------------
[feature.spot.pypi-dependencies]
bosdyn-client = "*"
bosdyn-core = "*"
bosdyn-api = "*"
bosdyn-mission = "*"
bosdyn-choreography-client = "*"

# -----------------------------------------------------------------------------
# Optional: Twist2 stack
# -----------------------------------------------------------------------------
[feature.twist2.pypi-dependencies]
dora-rs = "==0.3.13"
dora-rs-cli = "==0.3.13"
# dora-rs = "<0.4.0"
# dora-rs-cli = "<0.4.0"
onnxruntime = "*"
mujoco = "*"
rerun-sdk = "*"
fastapi = ">=0.100.0"
uvicorn = { version = "*", extras = ["standard"] }

[feature.twist2.tasks]
demo-twist2 = { cmd = "mjpython examples/advanced/twist2_simulation/app.py", env = { PYTHONPATH = "." } }
demo-twist2-rerun = { cmd = "python examples/advanced/twist2_simulation/app.py --no-viewer", env = { PYTHONPATH = "." } }
demo-twist2-web = { cmd = "python -m examples.advanced.twist2_web_simulation.app", env = { PYTHONPATH = "." } }

# -----------------------------------------------------------------------------
# Optional: Simulation test stack (lean, CI-gating)
# -----------------------------------------------------------------------------
# Just mujoco, not the full twist2 bundle (dora-rs/onnxruntime/rerun-sdk) - this
# is only for running the headless physics regression test in CI, not the
# interactive demo.
[feature.simulation_test.pypi-dependencies]
mujoco = "*"

[feature.simulation_test.tasks]
test-simulation = { cmd = "python -m pytest tests/examples/test_mujoco_manipulation_convergence.py", env = { PYTHONPATH = "." } }

# -----------------------------------------------------------------------------
# Optional: VLM planning stack
# -----------------------------------------------------------------------------
[feature.vlm_planning]
system-requirements = { libc = "2.31" }

[feature.vlm_planning.pypi-dependencies]
alfworld = { git = "https://github.com/XiaofengLin7/alfworld_vlm.git" }
litellm = "*"
gymnasium = "*"
typing = "*"

# -----------------------------------------------------------------------------
# Optional: PyTorch environments (CPU/GPU)
# -----------------------------------------------------------------------------
[feature.gpu]
platforms = ["linux-64"]
system-requirements = { cuda = "12.0" }

[feature.gpu.pypi-dependencies]
torch = { version = ">=2.5.1", index = "https://download.pytorch.org/whl/cu124" }
torchvision = { version = ">=0.20.1", index = "https://download.pytorch.org/whl/cu124" }

[feature.cpu.pypi-dependencies]
torch = { version = ">=2.5.1", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = ">=0.20.1", index = "https://download.pytorch.org/whl/cpu" }

# -----------------------------------------------------------------------------
# Optional: ROS 2 benchmarks
# -----------------------------------------------------------------------------
[feature.ros]
platforms = ["linux-64"]
channels = ["robostack-kilted", "https://prefix.dev/conda-forge"]

[feature.ros.dependencies]
ros-kilted-ros-core = ">=0.12.0,<0.13"
ros-kilted-rmw-cyclonedds-cpp = ">=4.0.2,<5"
colcon-common-extensions = "*"

[feature.ros.activation]
scripts = ["experiments/benchmarks/ros/install/setup.bash"]

[feature.ros.activation.env]
RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"

[feature.ros.tasks]
# Named ros-build so it cannot collide with the global `build` (python -m build):
# pixi treats a task defined in multiple environments as ambiguous.
ros-build = { cmd = "colcon build", cwd = "./experiments/benchmarks/ros" }
benchmark_python = "ros2 run benchmark_python publisher & ros2 run benchmark_python subscriber"
benchmark_cpp = "ros2 run benchmark_cpp publisher & ros2 run benchmark_cpp subscriber"
benchmark_cpp_components = "ros2 launch benchmark_cpp intra_process.launch.py"


# -----------------------------------------------------------------------------
# Optional: RoboPlan motion planning environments
# -----------------------------------------------------------------------------
[feature.roboplan]
platforms = ["linux-64", "osx-arm64"]

[feature.roboplan.dependencies]
roboplan-python = "*"
pinocchio = ">=3.9.0"

[feature.roboplan.pypi-dependencies]
xacro = "*"
tyro = "*"
viser = "*"
matplotlib = "*"

[feature.roboplan.tasks]
demo-ik           = { cmd = "python examples/advanced/motion_planning/ik_example.py", env = { PYTHONPATH = "." } }
demo-motion-track = { cmd = "python examples/advanced/motion_planning/motion_tracking_example.py", env = { PYTHONPATH = "." } }

# -----------------------------------------------------------------------------
# Environments
# -----------------------------------------------------------------------------
[environments]
default = { features = ["py311", "bundled_core"] }
training = { features = ["py311", "bundled_core", "training"] }
mapper = { features = ["py311", "bundled_core", "mapper"] }
spot = { features = ["py311", "bundled_core", "spot"] }
vlm = { features = ["py311", "bundled_core", "golden_retriever", "vlm_planning"] }
llm = { features = ["py311", "bundled_core", "golden_retriever", "vlm_planning"] }
torch = { features = ["py311", "bundled_core", "golden_retriever", "cpu"] }
twist2 = { features = ["py311", "bundled_core", "twist2"] }
simulation-test = { features = ["py311", "bundled_core", "simulation_test"] }
cpu = { features = ["py311", "bundled_core", "cpu"] }
gpu = { features = ["py311", "bundled_core", "gpu"] }
ros = { features = ["bundled_core", "ros"] }
roboplan = { features = ["bundled_core", "roboplan"] }
golden-retriever = { features = ["py311", "bundled_core", "golden_retriever"] }
docs = { features = ["py311", "docs"] }
golden-retriever-perception = { features = ["py311", "bundled_core", "golden_retriever", "cpu"] }

[feature.vlm_planning.tasks]

# -----------------------------------------------------------------------------
# Tasks
# -----------------------------------------------------------------------------
[tasks]
# Documentation site
# Run: pixi run -e docs docs-build
docs-install = "npm --prefix docs-site install"
docs-build = "npm --prefix docs-site install && npm --prefix docs-site run build"
docs-serve = "npm --prefix docs-site install && npm --prefix docs-site run dev"
test = { cmd = "python -m pytest tests -q", env = { PYTHONPATH = "." } }
build = "python -m build"

# Core runtime tutorial examples live in the main `retriever` repository.
# Golden task aliases below are reserved for Golden-specific advanced examples.
demo-robotics-typing-catalog = { cmd = "python examples/advanced/robotics_typing_standard/type_catalog_demo.py", env = { PYTHONPATH = "." } }
demo-robotics-typing-contract = { cmd = "python examples/advanced/robotics_typing_standard/compositional_contract_demo.py", env = { PYTHONPATH = "." } }
