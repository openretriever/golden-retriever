# =============================================================================
# Pixi Configuration (Golden / System Stack)
# =============================================================================
#
# This manifest captures the heavier Golden example/demo environment.
# It installs the core `retriever` wheel from `retriever_dist/` plus the extra
# libraries needed by the advanced system demos in this repo.
#
# =============================================================================

[workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[pypi-dependencies]
# Temporary: install this monorepo editable, but keep core extras only.
# In the split, this becomes the `retriever-golden` package in the golden repo.
retriever = { path = "./retriever_dist/install/retriever-0.0.0-py3-none-any.whl", editable = false, extras = [
    "dora",
    "demo",
] }

# Keep test tooling lightweight.
pygments = "*"
typing-extensions = "*"
mcap = "*"
jupytext = "*"

# -----------------------------------------------------------------------------
# Base system feature (the "golden" stack)
# -----------------------------------------------------------------------------
[dependencies]

[feature.py311.dependencies]
python = "3.11.*"

[feature.golden.dependencies]
# Required for HEIF bindings (pyheif / pillow-heif) when using the legacy stack.
libheif = "*"

[feature.golden.pypi-dependencies]
transformers = "*"
openai = "*"
accelerate = "*"
google-genai = "*"
pillow-heif = "*"
pyheif = "*"
ray = { version = "*", extras = ["all"] }
langchain = "*"
langchain_openai = "*"
supervision = "*"
ultralytics = "==8.3.40"
ultralytics-thop = "==2.0.12"
einops = "*"
pycocotools = "*"
sam2 = "*"
hydra-core = "*"
omegaconf = "*"
click = "*"
rich = "*"
ftfy = "*"
regex = "*"
tqdm = "*"
spatialmath-python = "*"
pydantic = ">=2.0.0"
fastapi = ">=0.100.0"
uvicorn = { version = "*", extras = ["standard"] }
httpx = "*"
pymongo = "*"
pytorch_lightning = "*"
pddlgym = { git = "https://github.com/linfeng-z/pddlgym.git" }
protobuf = "==3.20.*"
packaging = "*"
Pillow = "*"
scipy = "*"
pandas = "*"
seaborn = ">=0.13.2"
py-cpuinfo = ">=9.0.0"
rerun-sdk = "*"
wandb = "*"
bitsandbytes = "*"
gym = "*"
dspy-ai = ">=2.4.0"
python-dotenv = "*"

# -----------------------------------------------------------------------------
# Optional: Training stack
# -----------------------------------------------------------------------------
[feature.training.pypi-dependencies]
absl-py = "*"
aiohttp = "*"
aiosignal = "*"
async-timeout = "*"
attrs = "*"
charset-normalizer = "*"
cmake = "*"
datasets = "*"
deepspeed = "*"
evaluate = "*"
frozenlist = "*"
fsspec = "*"
huggingface-hub = "*"
idna = "*"
multidict = "*"
ninja = "*"
psutil = "*"
responses = "*"
safetensors = "*"
sentencepiece = "*"
tokenizers = "*"
torch = "*"
# triton = "*"
xxhash = "*"
yarl = "*"

# -----------------------------------------------------------------------------
# Optional: Mapper stack
# -----------------------------------------------------------------------------
[feature.mapper.pypi-dependencies]
dgl = "*"
open3d = "*"
lxml = "*"
PyMCubes = "*"
trimesh = "*"
pyglet = "==1.5.27"

# -----------------------------------------------------------------------------
# Optional: Spot SDK stack
# -----------------------------------------------------------------------------
[feature.spot.pypi-dependencies]
bosdyn-client = "*"
bosdyn-core = "*"
bosdyn-api = "*"
bosdyn-mission = "*"
bosdyn-choreography-client = "*"

# -----------------------------------------------------------------------------
# Optional: Twist2 stack
# -----------------------------------------------------------------------------
[feature.twist2.pypi-dependencies]
dora-rs = "==0.3.13"
dora-rs-cli = "==0.3.13"
# dora-rs = "<0.4.0"
# dora-rs-cli = "<0.4.0"
onnxruntime = "*"
mujoco = "*"
rerun-sdk = "*"

[feature.twist2.tasks]
demo-twist2 = { cmd = "mjpython examples/advanced/twist2_simulation/app.py", env = { PYTHONPATH = "." } }
demo-twist2-rerun = { cmd = "python examples/advanced/twist2_simulation/app.py --no-viewer", env = { PYTHONPATH = "." } }

# -----------------------------------------------------------------------------
# Optional: VLM planning stack
# -----------------------------------------------------------------------------
[feature.vlm_planning]
system-requirements = { libc = "2.31" }

[feature.vlm_planning.pypi-dependencies]
alfworld = { git = "https://github.com/XiaofengLin7/alfworld_vlm.git" }
litellm = "*"
gymnasium = "*"
typing = "*"

# -----------------------------------------------------------------------------
# Optional: PyTorch environments (CPU/GPU)
# -----------------------------------------------------------------------------
[feature.gpu]
platforms = ["linux-64"]
system-requirements = { cuda = "12.0" }

[feature.gpu.pypi-dependencies]
torch = { version = ">=2.5.1", index = "https://download.pytorch.org/whl/cu124" }
torchvision = { version = ">=0.20.1", index = "https://download.pytorch.org/whl/cu124" }

[feature.cpu.pypi-dependencies]
torch = { version = ">=2.5.1", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = ">=0.20.1", index = "https://download.pytorch.org/whl/cpu" }

# -----------------------------------------------------------------------------
# Optional: ROS 2 benchmarks
# -----------------------------------------------------------------------------
[feature.ros]
platforms = ["linux-64"]
channels = ["robostack-kilted", "https://prefix.dev/conda-forge"]

[feature.ros.dependencies]
ros-kilted-ros-core = ">=0.12.0,<0.13"
ros-kilted-rmw-cyclonedds-cpp = ">=4.0.2,<5"
colcon-common-extensions = "*"

[feature.ros.activation]
scripts = ["experiments/benchmarks/ros/install/setup.bash"]

[feature.ros.activation.env]
RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"

[feature.ros.tasks]
build = { cmd = "colcon build", cwd = "./experiments/benchmarks/ros" }
benchmark_python = "ros2 run benchmark_python publisher & ros2 run benchmark_python subscriber"

# -----------------------------------------------------------------------------
# Optional: RoboPlan motion planning environments
# -----------------------------------------------------------------------------
[feature.roboplan]
platforms = ["linux-64", "osx-arm64"]

[feature.roboplan.dependencies]
roboplan-python = "*"
pinocchio = ">=3.9.0"

[feature.roboplan.pypi-dependencies]
xacro = "*"
tyro = "*"
viser = "*"
matplotlib = "*"

[feature.roboplan.tasks]
demo-ik           = { cmd = "python examples/advanced/motion_planning/ik_example.py", env = { PYTHONPATH = "." } }
demo-motion-track = { cmd = "python examples/advanced/motion_planning/motion_tracking_example.py", env = { PYTHONPATH = "." } }

# -----------------------------------------------------------------------------
# Optional: TAMP tabletop environment
# -----------------------------------------------------------------------------
[feature.tamp]
platforms = ["linux-64", "osx-arm64"]

[feature.tamp.dependencies]
pybullet = "*"

[feature.tamp.pypi-dependencies]
"retriever-tamp" = { path = "./packages/retriever-tamp", editable = true }

[feature.tamp.tasks]
demo-tamp-tabletop-gui = { cmd = "python examples/advanced/tamp_tabletop_pick_place/app.py --sim pybullet-gui --final-hold-seconds 8" }
demo-tamp-tabletop-nosim = { cmd = "python examples/advanced/tamp_tabletop_pick_place/app.py --sim none --no-obstacle" }

# -----------------------------------------------------------------------------
# Environments
# -----------------------------------------------------------------------------
[environments]
default = { features = ["py311"] }
training = { features = ["py311", "training"] }
mapper = { features = ["py311", "mapper"] }
spot = { features = ["py311", "spot"] }
vlm = { features = ["py311", "golden", "vlm_planning"] }
llm = { features = ["py311", "golden", "vlm_planning"] }
torch = { features = ["py311", "golden", "cpu"] }
twist2 = { features = ["py311", "twist2"] }
cpu = { features = ["py311", "cpu"] }
gpu = { features = ["py311", "gpu"] }
ros = { features = ["ros"] }
roboplan = { features = ["roboplan"] }
golden = { features = ["py311", "golden"] }
tamp = { features = ["py311", "tamp"] }

[feature.vlm_planning.tasks]
# demo-highlevel-planning = { cmd = "python examples/experimental/closed_loop_planning/pipelines/demo_highlevel_planning.py" }
demo-highlevel-planning = { cmd = "python examples/experimental/closed_loop_planning/pipelines/demo_highlevel_planning.py", env = { RUST_LOG = "error" } }

# -----------------------------------------------------------------------------
# Tasks
# -----------------------------------------------------------------------------
[tasks]
# Tutorial examples (run from retriever_dist/ so examples/ is on the path)
demo-basic-flow       = { cmd = "python -m examples.tutorial.a_flow_fundamentals.01_basic_flow", cwd = "retriever_dist" }
demo-full-pipeline    = { cmd = "python -m examples.tutorial.a_flow_fundamentals.04_full_pipeline", cwd = "retriever_dist" }
demo-dora-simple      = { cmd = "python -m examples.tutorial.b_ir_and_execution.05_dora_simple", cwd = "retriever_dist" }
demo-dora             = { cmd = "python -m examples.tutorial.b_ir_and_execution.06_dora_perception --backend dora", cwd = "retriever_dist" }
demo-request-dora     = { cmd = "python -m examples.tutorial.b_ir_and_execution.07_request_response", cwd = "retriever_dist" }
demo-stepper          = { cmd = "python -m examples.tutorial.c_debug_and_replay.01_debug_stepper", cwd = "retriever_dist" }
demo-record-replay    = { cmd = "python -m examples.tutorial.c_debug_and_replay.04_record_replay_perception", cwd = "retriever_dist" }
demo-closed-loop-env  = { cmd = "python -m examples.tutorial.d_closed_loop_state_feedback.01_closed_loop_env", cwd = "retriever_dist" }
demo-symbolic-planning = { cmd = "python -m examples.tutorial.d_closed_loop_state_feedback.02_symbolic_planning", cwd = "retriever_dist" }
demo-multirate        = { cmd = "python -m examples.tutorial.e_resource_and_sync.01_multirate_window", cwd = "retriever_dist" }
demo-robotics-typing-catalog = { cmd = "python examples/advanced/robotics_typing_standard/type_catalog_demo.py", env = { PYTHONPATH = "." } }
demo-robotics-typing-contract = { cmd = "python examples/advanced/robotics_typing_standard/compositional_contract_demo.py", env = { PYTHONPATH = "." } }
demo-robotics-typing-boundary = "python examples/advanced/robotics_typing_standard/perception_to_control_boundary_demo.py"
demo-tamp-tabletop    = { cmd = "python examples/advanced/tamp_tabletop_pick_place/app.py --sim pybullet-direct" }
demo-synthetic-color-stepper = { cmd = "python examples/advanced/perception_debug/synthetic_color_stepper.py", env = { PYTHONPATH = "." } }
demo-perception-record = { cmd = "python examples/advanced/perception_debug/record_replay_perception.py record --out logs/perception_debug.mcap --steps 12", env = { PYTHONPATH = "." } }
demo-perception-replay = { cmd = "python examples/advanced/perception_debug/record_replay_perception.py replay --recording logs/perception_debug.mcap --steps 12", env = { PYTHONPATH = "." } }
demo-stateful-reset = { cmd = "python examples/advanced/state_management/stateful_flow_reset.py", env = { PYTHONPATH = "." } }
demo-belief-updater-internal = { cmd = "python examples/advanced/state_management/belief_updater_internal.py", env = { PYTHONPATH = "." } }
demo-belief-updater-explicit = { cmd = "python examples/advanced/state_management/belief_updater_explicit.py --steps 12 --dt 0.1", env = { PYTHONPATH = "." } }
demo-perception-replay-to-belief = { cmd = "python examples/advanced/state_management/perception_replay_to_belief.py --mode combined --steps 12", env = { PYTHONPATH = "." } }
demo-perception-belief-control = { cmd = "python examples/advanced/functional_wiring/perception_belief_control_pipeline.py", env = { PYTHONPATH = "." } }
demo-webcam-rerun = { cmd = "python examples/advanced/webcam_rerun/app.py", env = { PYTHONPATH = "." } }
demo-hierarchical-vla = { cmd = "python examples/advanced/hierarchical_vla/app.py --backend multiprocessing", env = { PYTHONPATH = "." } }
demo-llm-streaming = { cmd = "python -m examples.advanced.llm_streaming_rl.app", env = { PYTHONPATH = "." } }
demo-vlm-gridworld = { cmd = "python -m examples.advanced.vlm_gridworld.app", env = { PYTHONPATH = "." } }
demo-chaining = { cmd = "python examples/advanced/functional_wiring/chaining.py", env = { PYTHONPATH = "." } }
demo-fanin = { cmd = "python examples/advanced/functional_wiring/fanin.py", env = { PYTHONPATH = "." } }
demo-fanout = { cmd = "python examples/advanced/functional_wiring/fanout.py", env = { PYTHONPATH = "." } }
demo-sync-policies = { cmd = "python examples/advanced/functional_wiring/sync_policies.py", env = { PYTHONPATH = "." } }
demo-skill-switching = { cmd = "python -m examples.advanced.skill_switching.main", env = { PYTHONPATH = "." } }
demo-skill-switching-fanin = { cmd = "python -m examples.advanced.skill_switching.main --fan-in", env = { PYTHONPATH = "." } }
demo-pytorch-async = { cmd = "python examples/advanced/pytorch_cuda_async/app.py --backend multiprocessing", env = { PYTHONPATH = "." } }
binding-controller-python = { cmd = "python examples/advanced/native_controller/app.py --backend python --duration 5", env = { PYTHONPATH = "." } }
binding-controller-rust = { cmd = "python examples/advanced/native_controller/app.py --backend rust --duration 5", env = { PYTHONPATH = "." } }
binding-controller-cpp = { cmd = "python examples/advanced/native_controller/app.py --backend cpp --duration 5", env = { PYTHONPATH = "." } }
demo-multi-agent-communication = { cmd = "python examples/advanced/multi_agent_communication/app.py --mode step --steps 40 --dt 0.1", env = { PYTHONPATH = "." } }
notebook-to-ipynb-demo = { cmd = "python -m jupytext --to ipynb notebooks/src/retriever_demo.py --output notebooks/generated/retriever_demo.ipynb", env = { PYTHONPATH = "." } }

# Benchmarks
benchmark-dora-suite = { cmd = "dora up && dora start dataflow_node.yml --attach", cwd = "experiments/benchmarks/dora_benchmark/dora-rs/py-latency" }
benchmark-ros-suite-build = { cmd = "colcon build", cwd = "./experiments/benchmarks/dora_benchmark/ros2/py_pubsub" }
