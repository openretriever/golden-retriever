# benchmark-retriever-mp = { cmd = "python experiments/benchmarks/benchmark_retriever.py --backend multiprocessing", env = { PYTHONPATH = "." } }
# benchmark-retriever-in-process = { cmd = "python experiments/benchmarks/benchmark_retriever.py --backend in-process", env = { PYTHONPATH = "." } }
