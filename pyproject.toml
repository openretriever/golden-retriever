# Public metadata for GoldenRetriever, the companion examples and system-demo
# repository for the core Retriever runtime. The heavy optional stacks remain
# opt-in so the default public path stays documentation- and example-first.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/retriever_typing"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/src/retriever_typing",
    "/docs",
    "/examples",
    "/notebooks/src",
    "/tests",
]
exclude = [
    "/site",
    "/logs",
    "/reports",
    "/notebooks/generated",
    "/experiments/*/results",
]

[project]
name = "retriever-golden"
version = "0.0.0"
description = "Advanced examples and system integrations built on the Retriever runtime."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenRetriever" }]
keywords = ["robotics", "retriever", "examples", "closed-loop", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/openretriever/golden-retriever"
Documentation = "https://retriever-space.pages.dev/"
Repository = "https://github.com/openretriever/golden-retriever"
Issues = "https://github.com/openretriever/golden-retriever/issues"

[project.optional-dependencies]
# Legacy/system stack (carried over from the current monorepo; expect to refine).
