# Template `pyproject.toml` for the future Golden Retriever system repository.
#
# This repo is being refocused on the **Retriever runtime/core**. Heavy system deps
# (models, robots/sim, training, Ray, etc.) will move into a separate repo:
#   - Runtime: `retriever-rt` (imports as `retriever`)
#   - System:  `retriever-golden`
#
# This file is intentionally **not used** by packaging in this repo. It exists so we
# can copy it into the future golden repo and iterate without mixing system deps into
# the runtime `pyproject.toml`.
#
# When splitting repos:
#   1) Create `golden-retriever/` repo
#   2) Copy this file to `golden-retriever/pyproject.toml`
#   3) Adjust versions/entry-points/scripts as needed

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "retriever-golden"
version = "0.0.0"
description = "Golden Retriever: reference system built on Retriever runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Retriever Team" }
]

# In the split, Golden depends on the runtime distribution name (planned: retriever-rt).
# The import name remains `retriever`.
dependencies = [
    "retriever-rt>=0.0.0",
]

[project.optional-dependencies]
# Legacy/system stack (carried over from the current monorepo; expect to refine).
