    # Core ML & Framework
    "transformers",
    "openai",
    "accelerate",
    "google-generativeai",
    "pillow-heif",
    "pyheif",

    # Core Services & Utils
    "ray[all]",
    "langchain",
    "langchain_openai",

    # Core Model Deployment Packages
    "supervision",
    "ultralytics==8.3.40",
    "ultralytics-thop==2.0.12",
    "einops",
    "pycocotools",
    "sam2",

    # Configuration
    "hydra-core",
    "omegaconf",

    # Utilities
    "click",
    "rich",
    "ftfy",
    "regex",
    "tqdm",
    "spatialmath-python",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]",
    "httpx",
    "pymongo",
    "pytorch_lightning",

    # Data Processing & Utils
    "protobuf==3.20.*",  # For wandb compatibility
    "packaging",
    "Pillow",
    "numpy<2.0.0",
    "scipy",
    "pandas",
    "seaborn>=0.13.2",
    "py-cpuinfo>=9.0.0",

