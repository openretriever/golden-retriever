    # Utilities
    "click",
    "rich",
    "ftfy",
    "regex",
    "tqdm",
    "spatialmath-python",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]",
    "httpx",
    "pymongo",
    "pytorch_lightning",

    # Planning
    "pddlgym @ git+https://github.com/linfeng-z/pddlgym.git",

    # Data Processing & Utils
    "protobuf==3.20.*",  # For wandb compatibility
    "packaging",
    "Pillow",
    "numpy<2.0.0",
    "scipy",
    "pandas",
    "seaborn>=0.13.2",
