# Public metadata for GoldenRetriever, the reference examples and system-demo
# repository for the core Retriever runtime. The heavy optional stacks remain
# opt-in so the default public path stays documentation- and example-first.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/retriever_typing"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/src/retriever_typing",
    "/docs",
    "/examples",
    "/notebooks/src",
    "/tests",
]
exclude = [
    "/site",
    "/logs",
    "/reports",
    "/notebooks/generated",
    "/experiments/*/results",
]

# Local/future wheel metadata only. The first public launch distributes Golden
# examples and type packs through Retriever Hub, not as a separate PyPI product.
# Keep this name descriptive so it is not confused with a first-launch package.
[project]
name = "golden-retriever-examples"
version = "0.0.2"
description = "Robot-facing reference examples and Hub-distributed type packs for Retriever."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenRetriever" }]
keywords = ["robotics", "retriever", "examples", "closed-loop", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# retriever-core provides the canonical standard types that
# retriever_typing.v1 re-exports. The first public launch can consume these
# applied types through Hub; publish a wheel only if/when that becomes useful.
dependencies = [
    "retriever-core>=0.0.1",
    "numpy",
    "pyarrow",
]

[project.urls]
Homepage = "https://github.com/openretriever/golden-retriever"
Documentation = "https://golden.retriever.build/"
Repository = "https://github.com/openretriever/golden-retriever"
Issues = "https://github.com/openretriever/golden-retriever/issues"

# Retriever Hub module manifest: makes this repo hub-loadable so external
# consumers can pull the applied type pack without a PyPI wheel:
#   hub.use("openretriever/golden-retriever:WorldState")
# Contract across versions is the registered schema, not class identity —
# pin one ref per app. Standard types stay in retriever-core; these compose
# them and never redefine one.
[tool.retriever.module]
module = "retriever_typing"
min_retriever_version = "0.0.1"

[tool.retriever.module.exports]
WorldState = "retriever_typing.robotics_types:WorldState"
RobotState = "retriever_typing.robotics_types:RobotState"
BeliefGraph = "retriever_typing.robotics_types:BeliefGraph"
Skill = "retriever_typing.robotics_types:Skill"
Plan = "retriever_typing.robotics_types:Plan"
StructuredPlan = "retriever_typing.robotics_types:StructuredPlan"
TaskGoal = "retriever_typing.robotics_types:TaskGoal"
Trajectory = "retriever_typing.robotics_types:Trajectory"
ExecutionStatus = "retriever_typing.robotics_types:ExecutionStatus"
Action = "retriever_typing.core_types:Action"
Command = "retriever_typing.core_types:Command"
Status = "retriever_typing.core_types:Status"
convert_to_arrow = "retriever_typing.conversions:convert_to_arrow"
convert_from_arrow = "retriever_typing.conversions:convert_from_arrow"
# Runnable demo (needs numpy + opencv; opencv is imported lazily so consuming
# the payload types above never requires it):
#   hub.use("openretriever/golden-retriever:webcam")()
webcam = "retriever_typing.demos.webcam:run"

